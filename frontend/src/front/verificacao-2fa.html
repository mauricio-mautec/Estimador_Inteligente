<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificação 2FA | Estimador IA</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="left-panel">

        <span class="page-label">
            Segurança
        </span>

        <h1>Verificação em Duas Etapas</h1>

        <p>
            Um código de verificação foi enviado para o e-mail
            cadastrado. Digite o código abaixo para concluir o acesso.
        </p>

    </div>

    <div class="login-card">

        <h2>Validar Código</h2>

        <p style="margin-bottom:20px;color:#64748b;">
            Código enviado para:
            <strong>admin@estimador.com</strong>
        </p>

        <input
            type="text"
            id="codigo"
            maxlength="6"
            placeholder="Digite o código"
        >

        <button onclick="validarCodigo()">
            Validar Acesso
        </button>

        <span id="erro"></span>

    </div>

</div>

<script>

function validarCodigo(){

    const codigo =
        document.getElementById("codigo")
        .value
        .trim();

    if(!codigo){

        document.getElementById("erro")
            .innerText =
            "Informe o código recebido.";

        return;
    }

    if(codigo !== "123456"){

        document.getElementById("erro")
            .innerText =
            "Código inválido.";

        return;
    }

    localStorage.setItem(
        "autenticado_2fa",
        "true"
    );

    window.location.href =
        "dashboard.html";
}

</script>

</body>
</html>
